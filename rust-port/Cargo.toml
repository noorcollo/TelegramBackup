[package]
name = "telegram-backup-rs"
version = "0.1.0"
edition = "2021"
description = "Native Rust port of TelegramBackup v4"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
crossbeam-channel = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }
md5 = "0.7"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
